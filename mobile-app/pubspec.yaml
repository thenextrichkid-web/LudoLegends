name: ludo_legends
description: Ludo Legends Tournament Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # lottie: ^3.1.2  # Removed - requires NDK 28.2
  # fluttertoast: ^8.2.4  # Removed - incompatible with Flutter 3.44
  percent_indicator: ^4.2.3

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
