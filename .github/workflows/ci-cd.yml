name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend-api
          pip install -r requirements.txt
      - name: Run ruff
        run: |
          cd backend-api
          pip install ruff
          ruff check app/ --select E,F,W --ignore E501
      - name: Syntax check
        run: |
          cd backend-api
          python -m py_compile app/main.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ludo
          POSTGRES_PASSWORD: ludo_secret
          POSTGRES_DB: ludo_legends_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend-api
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://ludo:ludo_secret@localhost:5432/ludo_legends_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend-api
          python -m pytest tests/ -v --tb=short --timeout=30 || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker build
        run: |
          cd backend-api
          docker build -t ludo-legends-api:ci .
      - name: Save Docker image
        run: |
          docker save ludo-legends-api:ci | gzip > /tmp/ludo-legends-api.tar.gz

  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 35.193.127.84
          username: asr-automation
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/LudoLegends
            git pull origin master
            for f in app/api/health.py app/api/metrics_api.py app/core/metrics.py app/core/crash_reporter.py app/middleware/rate_limiter.py app/middleware/security.py app/main.py app/api/__init__.py requirements.txt; do
              docker cp backend-api/$f ludo-legends-api:/app/$f
            done
            docker restart ludo-legends-api
            sleep 8
            curl -sf http://localhost:8000/ready || (echo "Deploy failed"; exit 1)
            echo "Deploy successful"
